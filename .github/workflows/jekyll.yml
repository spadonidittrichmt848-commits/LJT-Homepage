name: Deploy personal homepage to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
      - name: Verify deployed pages
        run: |
          base_url="https://spadonidittrichmt848-commits.github.io/LJT-Homepage"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$base_url/" -o /tmp/homepage.html && \
               curl --fail --silent --show-error --location "$base_url/publications/" -o /tmp/publications.html; then
              break
            fi
            sleep 5
          done
          grep -q 'Junteng Liu' /tmp/homepage.html
          grep -q 'SynLogic' /tmp/homepage.html
          grep -q '<h2>2025</h2>' /tmp/publications.html
          grep -q 'Composing Parameter-Efficient Modules with Arithmetic Operations' /tmp/publications.html
          echo "Homepage and publications page verified."
